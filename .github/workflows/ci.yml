name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (without healpy)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: Test
        run: pytest -q --cov=gspwd --cov-report=term-missing

  oracle:
    # Equivalence of gspwd._healpix with healpy (GPL, used only as a test oracle).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,oracle]"
      - run: pytest -q -m oracle
